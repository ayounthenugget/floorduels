<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Duels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one narrow stage column. Board and duel are stacked cards under a slim brand bar. */
  --bg:#0a0c16; --panel:#141830; --panel2:#1c2145; --line:#2b3262; --grid:rgba(120,130,220,.09);
  --ink:#f3f1ea; --dim:#9aa3d1; --gold:#ffd23f; --good:#3ddc97; --bad:#ff5d73;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px}
.app{max-width:520px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font:700 20px var(--display);letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--gold)}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.status .room{font:700 14px var(--display);letter-spacing:.2em;color:var(--ink)}
.banner{background:var(--bad);color:#1a0006;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1500;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:17px}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.dim{color:var(--dim)}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
input[type=text]{min-height:48px;width:100%;border-radius:12px;border:1px solid var(--line);background:#0e1226;padding:0 14px;font-size:16px}
select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0e1226;padding:0 10px;max-width:100%}

/* home */
.hero{padding:10px 0 6px}
.hero h1{font-size:44px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.hero h1 span{color:var(--gold)}
.hero p{margin:10px 0 0;color:var(--dim);max-width:34ch}
.join{display:flex;gap:8px}
.join input{text-transform:uppercase;letter-spacing:.35em;font:700 22px var(--display);text-align:center}
.rules summary{cursor:pointer;font-weight:600}
.rules ol{margin:10px 0 0;padding-left:20px;color:var(--dim)}
.rules li{margin:4px 0}

/* lobby */
.codecard{display:flex;align-items:center;justify-content:space-between;gap:12px}
.code{font:700 40px var(--display);letter-spacing:.25em;color:var(--gold);line-height:1}
.plrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.plrow:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.plname{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.warn{color:var(--gold);border-color:#5a4d12}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip-btn[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1500}
.chip-btn:disabled{opacity:.35;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:transparent;cursor:pointer;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--gold)}
.seg button:disabled{cursor:default}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .sub{grid-column:2;display:flex;gap:8px}
.lrow select{flex:1}
.custom .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:12px 0}
.custom .it{background:#0e1226;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px}
.custom .it img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.custom .it input{min-height:34px;font-size:14px;padding:0 8px;border-radius:8px}

/* board */
.board{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px}
.tile{aspect-ratio:1;border-radius:9px;background:var(--c);color:#0a0c16;display:grid;place-items:center;position:relative;border:0;padding:0;font-family:var(--emoji);font-size:clamp(18px,6.2vw,32px);line-height:1}
.tile .tn{position:absolute;right:5px;bottom:2px;font:700 11px var(--display)}
.tile.legal{box-shadow:0 0 0 3px var(--gold);cursor:pointer;animation:glow 1.4s ease-in-out infinite alternate}
.tile.dim{opacity:.4}
.tile.sel{transform:scale(1.07);box-shadow:0 0 0 4px #fff;animation:none;z-index:1}
.tile.won{animation:pop .5s ease-out}
.turn{margin:2px 0 12px}
.turn h2{font-size:24px;line-height:1.15}
.turn p{margin:4px 0 0;color:var(--dim)}
.score{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sc{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.sc b{font-family:var(--display)}
.sc.out{opacity:.4;text-decoration:line-through}
.confirm{position:sticky;bottom:12px;margin-top:14px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:10px 12px}
.confirm span{font-weight:600}

/* duel */
.clocks{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;border-top:6px solid var(--c);min-width:0}
.pc.on{border-color:var(--c);box-shadow:0 0 26px -6px var(--c)}
.pc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .tm{font:700 40px/1.1 var(--display);font-variant-numeric:tabular-nums}
.pc .sq{font-size:12px;color:var(--dim)}
.pc.low .tm{color:var(--bad);animation:pulse .5s ease-in-out infinite alternate}
.vsb{align-self:center;font:700 14px var(--display);color:var(--dim);letter-spacing:.1em}
.catline{text-align:center;margin:12px 0 0;font:600 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:10px 0 12px;aspect-ratio:1/.85;display:grid;place-items:center;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.pic{font-family:var(--emoji);font-size:clamp(110px,40vw,190px);line-height:1;display:grid;place-items:center;width:100%;height:100%}
.pic.txt{font-family:var(--display);font-weight:700;font-size:clamp(44px,14vw,84px);text-align:center;padding:0 16px;line-height:1.05;text-wrap:balance}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic.swap{animation:pop .25s ease-out}
.flash{position:absolute;inset:0;display:grid;place-items:center;font:700 120px var(--display);opacity:0;pointer-events:none}
.flash.ok{color:var(--good)} .flash.no{color:var(--bad)}
.flash.show{animation:flash .7s ease-out}
.reveal{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;background:var(--bad);color:#1a0006;border-radius:12px;padding:8px;font-weight:700;display:none}
.reveal.show{display:block}
.ready{position:absolute;inset:0;background:rgba(10,12,22,.9);display:none;place-content:center;text-align:center;gap:6px}
.ready.on{display:grid}
.ready .rn{font:700 96px/1 var(--display);color:var(--gold)}
.ready .rt{font-weight:600;color:var(--dim)}
.ans{display:flex;gap:8px}
.ans input{min-height:54px;font-size:18px}
.ans .btn{min-height:54px;flex:none}
.wait{text-align:center;color:var(--dim);padding:14px 0;font-weight:600}
.shake{animation:shake .3s}

/* result / over */
.result{text-align:center}
.result h2{font-size:34px;margin:6px 0}
.result p{color:var(--dim);margin:0 0 16px}
.big{font-size:56px;line-height:1}

@keyframes glow{from{box-shadow:0 0 0 3px var(--gold)}to{box-shadow:0 0 0 3px var(--gold),0 0 18px 2px rgba(255,210,63,.55)}}
@keyframes pulse{from{opacity:1}to{opacity:.55}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}

</style>
</head>

// ---- Floor Duels engine: pure logic, no DOM. ----
const COLORS = ['#ff6b6b','#4dabf7','#51cf66','#ffa94d','#b197fc','#22d3c5','#f783ac','#d0ea5c'];
const MAXP = 8;

function parseItem(s){
  if (s.startsWith('txt:')) { const i = s.indexOf('|'); return {pic: s.slice(0, i), ans: s.slice(i + 1).split('|')}; }
  const i = s.indexOf(' ');
  return {pic: s.slice(0, i), ans: s.slice(i + 1).split('|')};
}
const CAT = {};
for (const c of BANK) CAT[c.id] = {id: c.id, name: c.name, ico: c.ico, list: c.items.map(parseItem)};

function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(a|an|the) /, '');
}
function lev(a, b){
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function judge(text, answers){
  const t = norm(text).replace(/ /g, '');
  if (!t) return false;
  for (const a of answers) {
    const n = norm(a).replace(/ /g, '');
    if (!n) continue;
    if (t === n) return true;
    const d = n.length >= 9 ? 2 : n.length >= 5 ? 1 : 0;
    if (d && Math.abs(t.length - n.length) <= d && lev(t, n) <= d) return true;
  }
  return false;
}

function shuffle(a, rnd){ rnd = rnd || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dims(total){ let r = 1; for (let i = 1; i * i <= total; i++) if (total % i === 0) r = i; return [r, total / r]; } // [rows, cols]
function ownerAt(g, i){ return typeof g === 'string' ? g.charCodeAt(i) - 48 : g[i]; }
function isAdj(cols, a, b){ return a !== b && Math.abs(a % cols - b % cols) <= 1 && Math.abs(Math.floor(a / cols) - Math.floor(b / cols)) <= 1; }
function legalSquares(gr, cols, ch){
  const n = gr.length, out = [];
  for (let i = 0; i < n; i++) {
    if (ownerAt(gr, i) === ch) continue;
    for (let j = 0; j < n; j++) if (ownerAt(gr, j) === ch && isAdj(cols, i, j)) { out.push(i); break; }
  }
  return out;
}
function countSq(gr, np){ const c = Array(np).fill(0); for (let i = 0; i < gr.length; i++) c[ownerAt(gr, i)]++; return c; }

function createEngine(publish, clock, rnd){
  clock = clock || Date.now; rnd = rnd || Math.random;
  const epoch = Math.random().toString(36).slice(2, 7);
  const custom = {};            // custom photo categories: id -> {id,name,ico,list}
  let decks = {}, cur = null, lastT = 0, readyAt = 0, resultAt = 0, evn = 0;
  let S = fresh([], {k: 2, s: 45}, 0);

  function fresh(pl, o, v){
    return {e: epoch, v, ph: 'lobby', o, pl, cx: [], cols: 0, rows: 0, gr: [], ch: -1, df: -1, sq: -1,
      rem: [0, 0], tn: 0, run: 0, rdy: 0, pic: '', ev: null, win: -1, los: -1, tk: 0};
  }
  const catOf = id => CAT[id] || custom[id];
  function snapshot(){
    S.cx = Object.values(custom).map(c => ({id: c.id, name: c.name, ico: c.ico}));
    if (S.ph === 'ready') S.rdy = Math.max(0, readyAt - clock());
    return JSON.parse(JSON.stringify(Object.assign({}, S, {gr: Array.isArray(S.gr) ? S.gr.join('') : S.gr})));
  }
  function bump(){ S.v++; publish(snapshot()); }
  function advance(){ if (S.ph === 'duel' && S.run) { const t = clock(); S.rem[S.tn] -= t - lastT; lastT = t; } }
  function nextPic(){
    const cid = S.pl[S.df].cat, cat = catOf(cid);
    let d = decks[cid];
    if (!d || d.i >= d.order.length) {
      const order = shuffle([...cat.list.keys()], rnd);
      if (d && order.length > 1 && order[0] === d.order[d.order.length - 1]) { const t = order[0]; order[0] = order[order.length - 1]; order[order.length - 1] = t; }
      d = decks[cid] = {order, i: 0};
    }
    cur = cat.list[d.order[d.i++]];
    S.pic = cur.pic;
  }
  function canStart(){ return S.ph === 'lobby' && S.pl.length >= 2 && S.pl.every(p => p.cat && catOf(p.cat)); }
  function finish(){
    const lo = S.tn === 0 ? S.ch : S.df, wi = S.tn === 0 ? S.df : S.ch;
    S.run = 0; S.rem[S.tn] = 0;
    let tk = 0;
    S.gr = S.gr.map(o => { if (o === lo) { tk++; return wi; } return o; });
    S.tk = tk; S.win = wi; S.los = lo; S.ph = 'result'; S.ev = null;
    resultAt = clock() + 4500;
    bump();
  }

  return {
    get state(){ return S; },
    addCategory(c){ // {id,name,ico,items:[{pic,ans:[...]}]}
      if (!c || !c.id || !c.items || !c.items.length) return;
      custom[c.id] = {id: c.id, name: String(c.name).slice(0, 18), ico: c.ico || '📷', list: c.items};
      if (S.ph === 'lobby') bump();
    },
    removeCategory(id){ delete custom[id]; S.pl = S.pl.map(p => p.cat === id ? Object.assign({}, p, {cat: ''}) : p); if (S.ph === 'lobby') bump(); },
    setRoster(list){
      if (S.ph !== 'lobby') return;
      const seen = new Set(), pl = [];
      for (const p of list.slice(0, MAXP)) {
        let cat = p.cat && catOf(p.cat) ? p.cat : '';
        if (cat && seen.has(cat)) cat = '';
        if (cat) seen.add(cat);
        pl.push({id: String(p.id).slice(0, 12), nm: String(p.nm || '').trim().slice(0, 12) || 'Player ' + (pl.length + 1), cat});
      }
      if (JSON.stringify(pl) !== JSON.stringify(S.pl)) { S.pl = pl; bump(); }
    },
    setOpts(o){
      if (S.ph !== 'lobby') return;
      const k = [2, 3, 4].includes(o.k) ? o.k : S.o.k, s = [30, 45, 60].includes(o.s) ? o.s : S.o.s;
      if (k !== S.o.k || s !== S.o.s) { S.o = {k, s}; bump(); }
    },
    canStart,
    start(){
      if (!canStart()) return false;
      const n = S.pl.length, total = n * S.o.k, [r, c] = dims(total);
      decks = {};
      const g = []; for (let i = 0; i < n; i++) for (let j = 0; j < S.o.k; j++) g.push(i);
      shuffle(g, rnd);
      S.rows = r; S.cols = c; S.gr = g; S.ch = Math.floor(rnd() * n); S.df = -1; S.sq = -1;
      S.ph = 'pick'; S.ev = null; S.win = -1; S.los = -1; S.tk = 0;
      bump(); return true;
    },
    newGame(){ const v = S.v; S = fresh(S.pl, S.o, v); bump(); },
    sync(){ bump(); },
    act(id, a){
      const idx = S.pl.findIndex(p => p.id === id);
      if (idx < 0 || !a) return;
      if (a.k === 'c') {
        if (S.ph !== 'pick' || idx !== S.ch) return;
        const sq = a.sq | 0;
        if (!legalSquares(S.gr, S.cols, S.ch).includes(sq)) return;
        S.sq = sq; S.df = S.gr[sq]; S.ph = 'ready';
        S.rem = [S.o.s * 1000, S.o.s * 1000]; S.tn = 0; S.run = 0; S.pic = ''; S.ev = null;
        readyAt = clock() + 3000;
        bump(); return;
      }
      if (S.ph !== 'duel' || !S.run) return;
      if (idx !== (S.tn === 0 ? S.ch : S.df)) return;
      advance();
      if (S.rem[S.tn] <= 0) { finish(); return; }
      if (a.k === 'a') {
        if (typeof a.t !== 'string') return;
        if (judge(a.t.slice(0, 60), cur.ans)) { S.ev = {k: 'ok', n: ++evn}; S.tn = 1 - S.tn; nextPic(); }
        else S.ev = {k: 'no', n: ++evn};
        bump();
      } else if (a.k === 'j') { // judged correct by a human (spoken answers)
        S.ev = {k: 'ok', n: ++evn}; S.tn = 1 - S.tn; nextPic(); bump();
      } else if (a.k === 'p') {
        S.rem[S.tn] -= 3000;
        const shown = cur.ans[0];
        S.ev = {k: 'pass', n: ++evn, a: shown};
        if (S.rem[S.tn] <= 0) { finish(); return; }
        nextPic(); bump();
      }
    },
    tick(){
      const t = clock();
      if (S.ph === 'ready' && t >= readyAt) { S.ph = 'duel'; S.run = 1; S.tn = 0; lastT = t; S.ev = null; nextPic(); bump(); }
      else if (S.ph === 'duel' && S.run) { advance(); if (S.rem[S.tn] <= 0) finish(); }
      else if (S.ph === 'result' && t >= resultAt) {
        if (new Set(S.gr).size === 1) S.ph = 'over';
        else { S.ph = 'pick'; S.ch = S.win; S.df = -1; S.sq = -1; S.ev = null; }
        bump();
      }
    }
  };
}

if (typeof module !== 'undefined') module.exports = {createEngine, judge, norm, dims, legalSquares, countSq, CAT, BANK, parseItem};

// ---- Standalone build only: a tiny "room" built on PeerJS (WebRTC). ----
// Star topology. Whoever creates the room code is the hub: it relays everyone's
// presence to everyone, matching the room API the app already uses.
(function(){
  if (window.claude) return;
  window.FD_WEB = true;

  function join(name){
    return new Promise((resolve, reject) => {
      if (!window.Peer) return reject({code: 'upstream_error', message: 'PeerJS did not load'});
      const hubId = 'fduel-' + String(name).toLowerCase().replace(/[^a-z0-9]/g, '');
      let settled = false;
      const done = (fn, v) => { if (!settled) { settled = true; fn(v); } };
      const asGuest = () => {
        const p = new Peer();
        p.on('error', e => done(reject, {code: 'upstream_error', message: e.type || String(e)}));
        p.on('open', id => {
          const c = p.connect(hubId, {reliable: true, serialization: 'json'});
          c.on('open', () => done(resolve, makeRoom(p, id, false, c)));
          c.on('error', e => done(reject, {code: 'upstream_error', message: String(e)}));
          setTimeout(() => done(reject, {code: 'upstream_error', message: 'timeout'}), 9000);
        });
      };
      const p = new Peer(hubId);
      p.on('open', () => done(resolve, makeRoom(p, hubId, true, null)));
      p.on('error', e => {
        if (e.type === 'unavailable-id') { try { p.destroy(); } catch (x) {} asGuest(); }
        else done(reject, {code: 'upstream_error', message: e.type || String(e)});
      });
    });
  }

  function makeRoom(peer, myId, isHub, hubConn){
    const fns = new Set();
    let mine = {}, list = [], timer = 0, closed = false;
    const conns = new Map();           // hub only: id -> conn
    const pmap = new Map([[myId, mine]]); // hub only: id -> presence
    const merge = (o, patch) => { for (const k in patch) { if (patch[k] === null) delete o[k]; else o[k] = patch[k]; } };
    const notify = () => fns.forEach(f => { try { f({}); } catch (e) { console.error(e); } });
    const snapshotList = () => Array.from(pmap.entries());
    function flush(){
      timer = 0; if (closed) return;
      const msg = {t: 'list', list: snapshotList()};
      conns.forEach(c => { if (c.open) { try { c.send(msg); } catch (e) {} } });
      notify();
    }
    const schedule = () => { if (!timer) timer = setTimeout(flush, 40); };

    if (isHub) {
      peer.on('connection', c => {
        c.on('open', () => { conns.set(c.peer, c); pmap.set(c.peer, {}); schedule(); });
        c.on('data', d => { if (d && d.t === 'pres' && pmap.has(c.peer)) { merge(pmap.get(c.peer), d.patch); schedule(); } });
        const gone = () => { if (conns.delete(c.peer)) { pmap.delete(c.peer); schedule(); } };
        c.on('close', gone); c.on('error', gone);
      });
    } else {
      hubConn.on('data', d => { if (d && d.t === 'list') { list = d.list; notify(); } });
      const lost = () => { list = []; notify(); };
      hubConn.on('close', lost); hubConn.on('error', lost);
    }

    return {
      presence(patch){
        merge(mine, patch);
        if (isHub) { pmap.set(myId, mine); schedule(); }
        else if (hubConn.open) hubConn.send({t: 'pres', patch: JSON.parse(JSON.stringify(patch, (k, v) => v === undefined ? null : v))});
        return Promise.resolve();
      },
      peers(){
        const src = isHub ? snapshotList() : list;
        const out = src.filter(([id]) => id !== myId).map(([id, p]) => ({peer: id, isMe: false, presence: Object.freeze(Object.assign({}, p))}));
        out.unshift({peer: myId, isMe: true, presence: Object.freeze(Object.assign({}, mine))});
        return out;
      },
      onPeers(fn){ fns.add(fn); setTimeout(() => { try { fn({}); } catch (e) { console.error(e); } }, 0); return () => fns.delete(fn); },
      leave(){ closed = true; clearTimeout(timer); fns.clear(); try { peer.destroy(); } catch (e) {} return Promise.resolve(); }
    };
  }

  const assets = {upload: blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({pic: r.result}); r.onerror = rej; r.readAsDataURL(blob); })};
  window.claude = {use: async n => n === 'room' ? {join} : n === 'assets' ? assets : null};
})();

function customEditor(catOptions, onChange){
  const card = h('div', {class: 'card custom stack'});
  const list = h('div', {});
  const form = h('div', {class: 'stack', hidden: true});
  const head = h('div', {class: 'row', style: 'justify-content:space-between'},
    h('div', {}, h('div', {class: 'lbl', text: 'Photo categories'}), h('div', {class: 'dim', style: 'font-size:14px', text: 'Upload your own pictures, like the real show.'})));
  const addBtn = h('button', {class: 'btn ghost sm', type: 'button', text: '+ New', onclick: () => { form.hidden = false; addBtn.hidden = true; nameIn.focus(); }});
  head.append(addBtn);
  card.append(head, list, form);

  function drawList(){
    list.replaceChildren(...A.custom.map(c => h('div', {class: 'plrow'}, h('span', {text: '📷'}),
      h('span', {class: 'plname', text: c.name + ' · ' + c.items.length + ' photos'}),
      h('button', {class: 'btn ghost sm', type: 'button', text: 'Delete', onclick: () => {
        A.custom = A.custom.filter(x => x.id !== c.id); store.set('fl_custom', JSON.stringify(A.custom));
        A.eng.removeCategory(c.id); onChange();
        for (const p of A.local) if (p.cat === c.id) p.cat = '';
        drawList(); if (A.mode === 'local') A.eng.setRoster(A.local);
      }}))));
  }
  drawList();

  const nameIn = h('input', {type: 'text', maxlength: 18, placeholder: 'Category name (e.g. Our Friend Group)', 'aria-label': 'Category name'});
  const file = h('input', {type: 'file', accept: 'image/*', multiple: true, 'aria-label': 'Choose photos'});
  const grid = h('div', {class: 'items'});
  const info = h('div', {class: 'dim', style: 'font-size:14px', text: 'Pick at least 4 photos. Type the answer under each one. Use | between accepted answers.'});
  const save = h('button', {class: 'btn primary block', type: 'button', text: 'Save category', disabled: true});
  const cancel = h('button', {class: 'btn ghost block', type: 'button', text: 'Cancel', onclick: reset});
  let pending = [];
  function reset(){ pending.forEach(p => URL.revokeObjectURL(p.url)); pending = []; grid.replaceChildren(); file.value = ''; nameIn.value = ''; form.hidden = true; addBtn.hidden = false; save.disabled = true; save.textContent = 'Save category'; }
  form.append(nameIn, file, info, grid, save, cancel);

  async function shrink(f){
    const bmp = await createImageBitmap(f);
    const sc = Math.min(1, (window.FD_WEB ? 480 : 720) / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', window.FD_WEB ? 0.7 : 0.82));
  }
  file.addEventListener('change', async () => {
    const files = Array.from(file.files || []).slice(0, 40 - pending.length);
    for (const f of files) {
      try {
        const blob = await shrink(f);
        const inp = h('input', {type: 'text', value: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), 'aria-label': 'Answer for ' + f.name});
        const url = URL.createObjectURL(blob);
        const it = {blob, url, inp};
        pending.push(it);
        grid.append(h('div', {class: 'it'}, h('img', {src: url, alt: ''}), inp));
      } catch (e) { toast('Could not read ' + f.name); }
    }
    save.disabled = pending.length < 4;
  });
  save.addEventListener('click', async () => {
    const name = nameIn.value.trim();
    if (!name) { toast('Give the category a name'); nameIn.focus(); return; }
    if (pending.length < 4) { toast('Add at least 4 photos'); return; }
    save.disabled = true; const items = [];
    try {
      for (let i = 0; i < pending.length; i++) {
        save.textContent = 'Uploading ' + (i + 1) + '/' + pending.length + '…';
        const r = await A.assets.upload(pending[i].blob);
        const ans = pending[i].inp.value.split('|').map(x => x.trim()).filter(Boolean);
        if (!ans.length) throw new Error('Every photo needs an answer');
        items.push({pic: r.pic || '/_blob/' + r.id, ans});
      }
    } catch (e) { toast('Upload failed: ' + (e && e.message ? e.message : 'try again')); save.disabled = false; save.textContent = 'Save category'; return; }
    const cat = {id: 'c_' + uid(), name, ico: '📷', items};
    A.custom.push(cat); store.set('fl_custom', JSON.stringify(A.custom));
    A.eng.addCategory(cat);
    reset(); drawList(); onChange();
  });
  return card;
}

BUILD.duel = function(){
  const E = {};

  function pcard(i){
    E['p' + i] = h('div', {class: 'pc'}, E['n' + i] = h('div', {class: 'nm'}), E['t' + i] = h('div', {class: 'tm'}), E['q' + i] = h('div', {class: 'sq'}));

  E.okb.addEventListener('click', () => send({k: 'j'}));
  E.peek.addEventListener('click', () => {
    const s = A.snap, id = s.pl[s.df].cat;
    const list = CAT[id] ? CAT[id].list : ((A.custom.find(c => c.id === id) || {}).items || []);
    const it = list.find(i => i.pic === s.pic);
    E.reveal.textContent = 'Answer: ' + (it ? it.ans[0] : '?'); E.reveal.classList.add('show');

  E.pic = h('div', {class: 'pic', 'aria-live': 'polite'});
  E.flash = h('div', {class: 'flash', 'aria-hidden': 'true'});
  E.reveal = h('div', {class: 'reveal'});
  E.rn = h('div', {class: 'rn'}); E.rt = h('div', {class: 'rt'});
  E.ready = h('div', {class: 'ready'}, E.rn, E.rt);
  E.cat = h('div', {class: 'catline'});
  const root = h('div', {},
    h('div', {class: 'clocks'}, pcard(0), h('div', {class: 'vsb', text: 'VS'}), pcard(1)),
    E.cat, h('div', {class: 'stage'}, E.pic, E.flash, E.reveal, E.ready), E.form, E.wait);
  E.form.addEventListener('submit', ev => {
    ev.preventDefault();

  E.pass.addEventListener('click', () => { send({k: 'p'}); if (!E.inp.hidden) E.inp.focus(); });
  let lastPic = null, couldAct = false, revT = 0;

  function ticker(){
    const s = A.snap; if (!s) return;
    const el = Math.max(0, performance.now() - A.at);
    const r = s.rem.slice();
    if (s.ph === 'duel' && s.run) r[s.tn] -= el;
    [0, 1].forEach(i => {
      E['t' + i].textContent = fmt(r[i]);
      const active = s.ph === 'duel' && s.tn === i;

      E['p' + i].classList.toggle('low', active && r[i] < 10000);

    if (s.ph === 'ready') E.rn.textContent = Math.max(1, Math.ceil((s.rdy - el) / 1000));

  return {root, ticker, update(s){

    [[0, a, s.ch], [1, b, s.df]].forEach(([i, p, idx]) => {

    if (s.ev && s.ev.n !== A.evSeen) {

        E.flash.className = 'flash ' + s.ev.k; void E.flash.offsetWidth; E.flash.classList.add('show');
        if (s.ev.k === 'no') { E.inp.classList.remove('shake'); void E.inp.offsetWidth; E.inp.classList.add('shake'); }
      }
    }
    const active = s.tn === 0 ? s.ch : s.df, live = s.ph === 'duel';
    const can = live && canAs(s, active);
    E.form.hidden = !can;
    const sp = A.mode === 'local' && A.spoken;
    E.inp.hidden = sp; E.go.hidden = sp; E.okb.hidden = !sp; E.peek.hidden = !sp;
    E.wait.hidden = can;
    E.wait.textContent = s.ph === 'ready' ? 'Get ready…' : s.pl[active].nm + ' is answering…';
    if (A.mode === 'local' && can) E.inp.placeholder = s.pl[active].nm + ': type your answer';

  }};
};

function offlineMsg(){
  if (A.api) return true;
  toast(A.api === undefined ? 'Still connecting. Try again in a few seconds.' : (window.FD_WEB ? "Online play couldn't start. Check your connection and reload." : "Online play isn't available for your account on this link. You need the link shared with you and to be signed in to Claude."));
  return false;
}
async function startHost(){
  if (!offlineMsg()) return;
  const code = makeCode();
  try { A.room = await A.api.join('fl-' + code.toLowerCase()); } catch (e) { toast('Could not open a room: ' + ((e && (e.code || e.message)) || 'unknown error')); return; }
  A.mode = 'host'; A.host = true; A.code = code; A.order = [A.pid]; A.acSeen = {};
  drawTop();
  pres({pid: A.pid, nm: store.get('fl_nm') || '', ct: '', h: 1});
  startEngine(s => pres({g: s}));
  A.room.onPeers(hostPeers);
  hostPeers(); A.eng.sync();
}
function hostPeers(){
  if (!A.room || !A.eng) return;
  const by = {};
  for (const p of A.room.peers()) { const pr = p.presence; if (pr && pr.pid) { by[pr.pid] = pr; if (!A.order.includes(pr.pid)) A.order.push(pr.pid); } }
  A.eng.setRoster(A.order.filter(id => by[id]).map(id => ({id, nm: by[id].nm || '', cat: by[id].ct || ''})));
  for (const id in by) {
    const ac = by[id].ac;
    if (ac && ac.n > (A.acSeen[id] || 0)) { A.acSeen[id] = ac.n; if (id !== A.pid) A.eng.act(id, ac); }
  }
}

async function startJoin(raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { toast('Room codes have 4 letters'); return; }
  if (!offlineMsg()) return;
  try { A.room = await A.api.join('fl-' + code.toLowerCase()); } catch (e) { toast('Could not join: ' + ((e && (e.code || e.message)) || 'unknown error')); return; }
  A.mode = 'guest'; A.host = false; A.code = code; A.snapKey = ''; A.hostGone = false;
  drawTop(); showConnecting('Looking for room ' + code + '…');
  pres({pid: A.pid, nm: store.get('fl_nm') || '', ct: ''});
  A.room.onPeers(guestPeers);
  guestPeers();
  A.joinT = setTimeout(() => { if (!A.snap) { leave(); toast('No game found with code ' + code); } }, 7000);
}
function guestPeers(){
  if (!A.room) return;
  const hp = A.room.peers().find(p => p.presence && p.presence.h === 1 && p.presence.g);
  if (!hp) {
    if (A.snap && !A.hostGone) { A.hostGone = true; $banner.hidden = false; $banner.style.background = ''; $banner.style.color = ''; $banner.textContent = 'The host left, so the game is over.'; }
    return;
  }
  if (A.hostGone) { A.hostGone = false; $banner.hidden = true; }
  const g = hp.presence.g, key = g.e + ':' + g.v;
  if (key !== A.snapKey) { A.snapKey = key; clearTimeout(A.joinT); onSnap(g); }
}

function leave(){
  clearInterval(A.tickT); clearTimeout(A.joinT);
  if (A.room) { try { A.room.leave(); } catch (e) {} }
  A.room = null; A.eng = null; A.host = false; A.hostGone = false; A.snapKey = '';
  showHome();
}

// ---------- boot ----------
// Live clocks for everyone (guests have no engine loop of their own).
setInterval(() => { if (A.ui && A.ui.ticker) A.ui.ticker(); }, 100);
drawTop(); showHome();
(async function init(){
  try { A.api = (window.claude && claude.use) ? await claude.use('room') : null; } catch (e) { A.api = null; }
  try { A.assets = (window.claude && claude.use) ? await claude.use('assets') : null; } catch (e) { A.assets = null; }
  if (A.mode === 'home' && showHome.sync) showHome.sync();
  else if (A.snap && A.kind === 'lobby' && A.eng && !A.ui.hasAssets) { A.kind = ''; render(); }
})();
})();

</script>
